<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Ledger Cover Gradient -->
    <linearGradient id="ledgerCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Wallet Leather Gradient -->
    <linearGradient id="walletLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#542409" />
      <stop offset="100%" stop-color="#3b1504" />
    </linearGradient>

    <!-- Cash Note Gradient -->
    <linearGradient id="cashNote" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Icon Background (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <g filter="url(#dropShadow)">
    <!-- Ledger Book Pages (White Block Underneath) -->
    <path d="M125 105 L375 105 C385 105 392 112 392 122 L392 410 C392 420 385 428 375 428 L125 428 Z" fill="#f8fafc" />
    
    <!-- Gilded / Stacked Page Edge Layers -->
    <line x1="392" y1="120" x2="392" y2="415" stroke="#cbd5e1" stroke-width="4" />
    <line x1="388" y1="115" x2="388" y2="420" stroke="#e2e8f0" stroke-width="3" />
    <line x1="130" y1="428" x2="380" y2="428" stroke="#cbd5e1" stroke-width="3" />

    <!-- Ledger Hardcover (Rich Emerald & Gold Border) -->
    <path d="M110 95 C110 88, 116 82, 124 82 L360 82 C370 82 378 90 378 100 L378 415 C378 425 370 432 360 432 L124 432 C116 432 110 426 110 418 Z" fill="url(#ledgerCover)" stroke="#047857" stroke-width="3" />

    <!-- Ledger Spine Binding Detail -->
    <path d="M110 95 C110 88, 116 82, 124 82 L142 82 L142 432 L124 432 C116 432 110 426 110 418 Z" fill="#022c22" />
    <line x1="142" y1="82" x2="142" y2="432" stroke="url(#goldFoil)" stroke-width="3" />
    
    <!-- Spine Gold Ribs -->
    <line x1="114" y1="140" x2="138" y2="140" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="114" y1="200" x2="138" y2="200" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="114" y1="320" x2="138" y2="320" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="114" y1="380" x2="138" y2="380" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Ledger Front Cover Gold Filigree Frame -->
    <rect x="156" y="98" width="206" height="318" rx="6" fill="none" stroke="url(#goldFoil)" stroke-width="2.5" />
    <rect x="162" y="104" width="194" height="306" rx="4" fill="none" stroke="url(#goldFoil)" stroke-width="1.2" opacity="0.8" />

    <!-- Ledger Book Title Text -->
    <text x="260" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" letter-spacing="2" fill="url(#goldFoil)">LEDGER</text>
    <text x="260" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" letter-spacing="3" fill="#6ee7b7">FINANCIAL BOOK</text>
    
    <!-- Ledger Sheet Lined Rows (Accounting Grid) -->
    <line x1="172" y1="185" x2="346" y2="185" stroke="url(#goldFoil)" stroke-width="1.5" opacity="0.6" />
    <line x1="172" y1="205" x2="346" y2="205" stroke="#047857" stroke-width="1" stroke-dasharray="4 3" opacity="0.8" />
    <line x1="172" y1="225" x2="346" y2="225" stroke="#047857" stroke-width="1" stroke-dasharray="4 3" opacity="0.8" />
    
    <!-- Emerald Satin Bookmark Ribbon Hanging Below Ledger -->
    <path d="M210 420 L210 462 L225 450 L240 462 L240 420 Z" fill="#10b981" stroke="#059669" stroke-width="2" />
    <line x1="225" y1="420" x2="225" y2="448" stroke="#34d399" stroke-width="1.5" />
  </g>

  <!-- Prominent Leather Wallet Resting On Top Of The Ledger -->
  <g filter="url(#dropShadow)">
    <!-- Cash Bill Peeking Out of Wallet Pocket -->
    <g transform="rotate(-6 270 230)">
      <rect x="230" y="215" width="160" height="75" rx="6" fill="url(#cashNote)" stroke="#059669" stroke-width="2" />
      <circle cx="310" cy="252" r="16" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 2" />
      <text x="310" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#047857">$</text>
      <text x="242" y="235" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#059669">100</text>
      <text x="376" y="280" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#059669" text-anchor="end">100</text>
    </g>

    <!-- Main Leather Wallet Body -->
    <rect x="225" y="248" width="180" height="135" rx="14" fill="url(#walletLeather)" stroke="#92400e" stroke-width="3" />
    
    <!-- Inner Leather Flap / Fold Shadow -->
    <path d="M225 292 C285 305 345 305 405 292" fill="none" stroke="#270e02" stroke-width="3" />
    
    <!-- Perimeter Tailored Stitching -->
    <rect x="231" y="254" width="168" height="123" rx="10" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.85" />

    <!-- Wallet Clasp Strap -->
    <path d="M345 292 L395 292 C404 292 411 299 411 308 C411 317 404 324 395 324 L345 324 Z" fill="#542409" stroke="#92400e" stroke-width="2" />
    <path d="M346 295 L394 295 C401 295 407 301 407 308 C407 315 401 321 394 321 L346 321 Z" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 2" />

    <!-- Golden Clasp Snap Button with Currency Insignia -->
    <circle cx="395" cy="308" r="14" fill="url(#goldFoil)" stroke="#fef08a" stroke-width="2" filter="url(#softShadow)" />
    <text x="395" y="313" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#78350f">$</text>
  </g>
</svg>
